<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Expo公式のSPA用テンプレート: npx expo customize public/index.html -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" href="/icons/favicon.png?v=2" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-title" content="このゆびとまれ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>%WEB_TITLE%</title>
    <!-- #134 フォント: public/fonts/ に置いたサブセットを同じオリジンから配る（外部への接続と CSS の往復をなくす）。
         文字を足したときは app/scripts/build_fonts.py で作り直す。表示は swap にして文字を先に出す -->
    <style id="kz-fonts">
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter-subset.woff2?v=3') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans JP';
        src: url('/fonts/noto-sans-jp-subset.woff2?v=3') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
