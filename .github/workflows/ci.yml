name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # main への公開は途中で止めない（PR のチェックは新しい push で古いものを止める）
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: マイグレーションのルール確認
        run: bash scripts/check_migrations.sh origin/main
      - name: 型チェック
        run: npm run typecheck
      - name: Web書き出し
        run: npm run build
      - name: 手元DBを作成
        run: npm run db:migrate:local
      - name: APIテスト
        run: |
          npx wrangler pages dev dist --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -s localhost:8788/api/health > /dev/null && break; sleep 2; done
          npm run test:api || (cat /tmp/wrangler.log; exit 1)

  # main に入ったら（= PR がマージされたら）本番 DB を更新して公開する。人もエージェントも手でデプロイしない
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kz2611.pages.dev
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2b5cae9b3758139d3ccb8dd71d42d98e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Web書き出し
        run: npm run build
      # マイグレーションは追加だけ（6章）なので、公開に失敗しても古いアプリのまま動く
      - name: 本番DBのマイグレーション
        run: npx wrangler d1 migrations apply kz2611-db --remote
      - name: 公開
        run: npx wrangler pages deploy dist --project-name kz2611 --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
      - name: 公開後の確認（DB につながるか）
        run: |
          for i in $(seq 1 12); do
            body=$(curl -s https://kz2611.pages.dev/api/health || true)
            echo "$body" | grep -q '"db":"ok"' && echo "OK: $body" && exit 0
            sleep 5
          done
          echo "公開後の確認に失敗: $body"; exit 1
